<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Snake Game - Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .project-detail {
            max-width: 1140px;
            margin: 80px auto;
            padding: 40px;
        }
        .project-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .project-header h1 {
            font-size: 2.5rem;
            color: var(--accent);
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }
        .project-subtitle {
            color: var(--muted);
            font-size: 1.1rem;
        }
        .game-container {
            background: rgba(255,255,255,0.01);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
            margin: 40px 0;
            text-align: center;
        }
        #snakeCanvas {
            background: #0a0e13;
            border: 2px solid var(--accent);
            display: block;
            margin: 20px auto;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255,70,85,0.2);
        }
        .game-controls {
            margin: 20px 0;
            color: #e6eef6;
            font-size: 0.9rem;
        }
        .game-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .stat-box {
            background: rgba(124,92,255,0.05);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid rgba(124,92,255,0.2);
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            color: var(--accent);
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 8px;
        }
        .game-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn-game {
            padding: 12px 24px;
            border: 1px solid var(--accent);
            background: rgba(255,70,85,0.1);
            color: var(--accent);
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all .3s;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
        }
        .btn-game:hover {
            background: rgba(255,70,85,0.2);
            box-shadow: 0 4px 12px rgba(255,70,85,0.15);
        }
        .btn-game.active {
            background: var(--accent);
            color: #fff;
        }
        .project-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        .info-box {
            background: rgba(255,255,255,0.01);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-box h3 {
            color: var(--accent-2);
            margin-top: 0;
        }
        .info-box p {
            color: #e6eef6;
            line-height: 1.8;
            margin: 0;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: rgba(124,92,255,0.1);
            border: 1px solid rgba(124,92,255,0.3);
            border-radius: 4px;
            color: var(--accent-2);
            text-decoration: none;
            font-weight: 600;
            transition: all .3s;
        }
        .back-btn:hover {
            background: rgba(124,92,255,0.2);
            border-color: rgba(124,92,255,0.5);
        }
        .instructions {
            background: rgba(255,70,85,0.05);
            padding: 20px;
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            margin-top: 20px;
        }
        .instructions h4 {
            color: var(--accent);
            margin-top: 0;
        }
        .instructions p {
            color: #e6eef6;
            margin: 8px 0;
        }
        @media (max-width: 768px) {
            .project-info {
                grid-template-columns: 1fr;
            }
            .game-stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="hud"><span class="ping">PING</span> 28ms · <span style="color:var(--muted)">FPS</span> 144</div>
    <nav class="top-nav">

        </div>
        <div class="nav-center">

            <a href="index.html#cv">CV</a>
            <a href="index.html#contact">Contact</a>
        </div>

            <a href="#" class="nav-cta">CV</a>
        </div>
    </nav>

    <main style="padding-top: 70px;">
        <div class="project-detail">
            <div class="project-header">
                <h1>SNAKE GAME</h1>
            </div>

            <div class="game-container">
                <canvas id="snakeCanvas" width="400" height="400"></canvas>
                
                <div class="game-stats">
                    <div class="stat-box">
                        <div class="stat-label">Score</div>
                        <div class="stat-value" id="score">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Meilleur Score</div>
                        <div class="stat-value" id="bestScore">0</div>
                    </div>
                </div>

                <div class="game-controls">
                    <p>🎮 Utilise les <strong>flèches directionnelles</strong> ou <strong>ZQSD</strong> pour diriger le serpent</p>
                </div>

                <div class="game-buttons">
                    <button class="btn-game active" onclick="startGame()">Démarrer</button>
                    <button class="btn-game" onclick="pauseGame()">Pause</button>
                    <button class="btn-game" onclick="resetGame()">Réinitialiser</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('snakeCanvas');
        const ctx = canvas.getContext('2d');
        
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let score = 0;
        let bestScore = localStorage.getItem('snakeBestScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameSpeed = 150;
        
        document.getElementById('bestScore').textContent = bestScore;
        
        function drawGame() {
            // Fond
            ctx.fillStyle = '#0a0e13';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grille
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // Nourriture
            ctx.fillStyle = '#ff4655';
            ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
            
            // Serpent
            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#7c5cff';
                } else {
                    ctx.fillStyle = 'rgba(124, 92, 255, 0.7)';
                }
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }
        
        function update() {
            if (!gameRunning || gamePaused) return;
            
            direction = nextDirection;
            
            const head = snake[0];
            const newHead = {
                x: head.x + direction.x,
                y: head.y + direction.y
            };
            
            // Collision avec les murs
            if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
                endGame();
                return;
            }
            
            // Collision avec soi-même
            for (let segment of snake) {
                if (newHead.x === segment.x && newHead.y === segment.y) {
                    endGame();
                    return;
                }
            }
            
            snake.unshift(newHead);
            
            // Collision avec nourriture
            if (newHead.x === food.x && newHead.y === food.y) {
                score += 10;
                document.getElementById('score').textContent = score;
                
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('snakeBestScore', bestScore);
                    document.getElementById('bestScore').textContent = bestScore;
                }
                
                food = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                
                gameSpeed = Math.max(50, gameSpeed - 1);
            } else {
                snake.pop();
            }
        }
        
        function gameLoop() {
            update();
            drawGame();
            setTimeout(gameLoop, gameSpeed);
        }
        
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                gamePaused = false;
                gameLoop();
            }
        }
        
        function pauseGame() {
            if (gameRunning) {
                gamePaused = !gamePaused;
            }
        }
        
        function resetGame() {
            snake = [{x: 10, y: 10}];
            food = {x: 15, y: 15};
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            gameSpeed = 150;
            gameRunning = false;
            gamePaused = false;
            document.getElementById('score').textContent = score;
            drawGame();
        }
        
        function endGame() {
            gameRunning = false;
            alert(`Game Over! Score: ${score}\nMeilleur score: ${bestScore}`);
            resetGame();
        }
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            switch(key) {
                case 'arrowup':
                case 'w':
                    if (direction.y === 0) nextDirection = {x: 0, y: -1};
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y === 0) nextDirection = {x: 0, y: 1};
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'q':
                    if (direction.x === 0) nextDirection = {x: -1, y: 0};
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x === 0) nextDirection = {x: 1, y: 0};
                    e.preventDefault();
                    break;
                case 'z':
                    if (direction.y === 0) nextDirection = {x: 0, y: -1};
                    e.preventDefault();
                    break;
            }
        });
        
        drawGame();
    </script>
</body>
</html>
